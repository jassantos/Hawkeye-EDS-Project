<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password</title>
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="overlay">
    <div class="login-box">
      <h2>Reset Password</h2>
      <p class="info-text">Enter new password</p>

      <input type="password" id="newPass" placeholder="New password" required />
      <button onclick="saveNewPassword()" class="login-btn">Reset Password</button>

      <a href="login.html" class="forgot">Back to Login</a>
    </div>
  </div>

  <script src="js/reset.js"></script>
</body>
</html>
