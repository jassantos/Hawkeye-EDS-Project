<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hawkeye EDS - Support Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">

        <!-- Logo -->
        <img src="assets/logo.png" alt="Hawkeye EDS Logo" class="logo">

        <!-- Main Title -->
        <h1 class="title">HAWKEYE EDS</h1>

        <!-- Welcome Text -->
        <p class="welcome">
            Welcome to the Hawkeye EDS<br>
            Customer Support Portal
        </p>

        <!-- Registration Title -->
        <h2 class="form-title">Registration Form</h2>

        <!-- Registration Form -->
        <form action="#" method="post">

            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" required>
            </div>

            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>

            <!-- Checkbox Row -->
            <div class="checkbox-row">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree to the Terms & Conditions</label>
            </div>

            <!-- Register Button -->
            <button type="submit">Register</button>

            <!-- Bottom Sign In -->
            <p class="bottom-signin">
                Already have an account?
                <a href="login.html">Sign In</a>
            </p>

        </form>

    </div>

    <!--  load JS after HTML so it can attach event listener -->
    <script src="js/main.js"></script>

</body>
</html>
